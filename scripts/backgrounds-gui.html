<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>背景图配置 · JxmFUN</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071019;
      --panel: rgba(16, 28, 38, 0.86);
      --panel-soft: rgba(255, 255, 255, 0.045);
      --line: rgba(180, 226, 238, 0.16);
      --text: #e8f6f8;
      --muted: #86a7b0;
      --cyan: #27dbe4;
      --pink: #ff74ad;
      --danger: #ff6b7d;
      --ok: #77e2a2;
      font-family: ui-sans-serif, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(circle at 18% 12%, rgba(39, 219, 228, 0.16), transparent 32%),
        radial-gradient(circle at 82% 18%, rgba(255, 116, 173, 0.12), transparent 34%),
        linear-gradient(145deg, #071019, #0a1720 55%, #101522);
      color: var(--text);
    }

    button, select, input { font: inherit; }
    button { cursor: pointer; }

    .shell {
      display: grid;
      width: min(1180px, calc(100% - 2rem));
      min-height: calc(100vh - 2rem);
      margin: 1rem auto;
      grid-template-columns: 310px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
    }

    .sidebar {
      display: flex;
      min-height: 0;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: rgba(3, 12, 18, 0.3);
    }

    .brand {
      padding: 1.1rem 1.15rem 0.9rem;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 { margin: 0; font-size: 1rem; letter-spacing: 0.04em; }
    .brand p { margin: 0.4rem 0 0; color: var(--muted); font-size: 0.72rem; line-height: 1.6; }

    .toolbar {
      display: flex;
      gap: 0.45rem;
      padding: 0.75rem;
      border-bottom: 1px solid var(--line);
    }

    .toolbar button {
      flex: 1;
      min-height: 2rem;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 0.72rem;
    }

    .toolbar button:hover { border-color: rgba(39, 219, 228, 0.5); color: var(--cyan); }

    .list {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding: 0.6rem;
      scrollbar-color: rgba(39, 219, 228, 0.35) transparent;
      scrollbar-width: thin;
    }

    .item {
      display: grid;
      width: 100%;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 0.62rem;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0.42rem;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .item:hover { background: rgba(255, 255, 255, 0.04); }
    .item.active { border-color: rgba(39, 219, 228, 0.42); background: rgba(39, 219, 228, 0.09); }

    .thumb {
      width: 58px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #030a0e center/cover no-repeat;
    }

    .item-name { overflow: hidden; color: var(--text); font-size: 0.76rem; text-overflow: ellipsis; white-space: nowrap; }
    .item-meta { margin-top: 0.18rem; color: var(--muted); font-size: 0.64rem; }
    .item.warn .item-meta { color: var(--danger); }

    .main {
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: clamp(0.9rem, 3vw, 1.5rem);
      gap: 1rem;
    }

    .preview {
      position: relative;
      display: grid;
      min-height: 240px;
      flex: 1;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%) 0 0 / 18px 18px,
        linear-gradient(315deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%) 0 0 / 18px 18px,
        #050d12;
    }

    .preview img {
      width: 100%;
      height: 100%;
      max-height: 62vh;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .preview img.ready { opacity: 1; }
    .preview.empty { color: var(--muted); font-size: 0.82rem; }

    .preview-label {
      position: absolute;
      right: 0.7rem;
      bottom: 0.65rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.28rem 0.65rem;
      background: rgba(3, 10, 14, 0.72);
      color: var(--muted);
      font-size: 0.64rem;
      backdrop-filter: blur(8px);
    }

    .editor {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.8rem;
      align-items: end;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.9rem;
      background: var(--panel-soft);
    }

    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem; }

    .field { display: grid; gap: 0.35rem; }
    .field span { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; }

    .field select {
      min-height: 2.35rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 0.65rem;
      outline: none;
      background: #08141b;
      color: var(--text);
    }

    .field select:focus { border-color: rgba(39, 219, 228, 0.62); }

    .actions { display: grid; gap: 0.45rem; }
    .actions button {
      min-width: 7.2rem;
      min-height: 2.35rem;
      border: 1px solid rgba(39, 219, 228, 0.5);
      border-radius: 8px;
      background: rgba(39, 219, 228, 0.12);
      color: var(--cyan);
      font-size: 0.76rem;
    }

    .actions button:hover:not(:disabled) { border-color: var(--pink); color: var(--pink); }
    .actions button:disabled { cursor: not-allowed; opacity: 0.4; }
    .actions .danger { border-color: rgba(255, 107, 125, 0.38); color: var(--danger); }

    .footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .footer code { color: var(--text); }
    .status { margin-left: auto; }
    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }

    .hint {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 0.75rem 0.85rem;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.6;
    }

    .hint strong { color: var(--text); }

    @media (max-width: 780px) {
      .shell { width: calc(100% - 1rem); margin: 0.5rem auto; grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); max-height: 42vh; }
      .main { padding: 0.8rem; }
      .editor { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr 1fr; }
      .actions button { min-width: 0; }
      .footer .status { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <header class="brand">
        <h1>背景图配置</h1>
        <p>修改会直接写入 <code>config/backgrounds.json</code>。保存后执行 <code>npm run docker:recreate</code> 生效。</p>
      </header>
      <div class="toolbar">
        <button id="sync" type="button">同步目录</button>
        <button id="prune" type="button">清理缺失</button>
        <button id="reload" type="button">刷新</button>
      </div>
      <div class="list" id="list" role="listbox" aria-label="背景图列表"></div>
    </aside>

    <main class="main">
      <div class="preview empty" id="preview"><span>选择一张背景图查看预览</span></div>

      <section class="editor">
        <div class="fields">
          <label class="field">
            <span>Theme</span>
            <select id="theme">
              <option value="both">both</option>
              <option value="day">day</option>
              <option value="night">night</option>
            </select>
          </label>
          <label class="field">
            <span>Platform</span>
            <select id="platform">
              <option value="both">both</option>
              <option value="computer">computer</option>
              <option value="phone">phone</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <button id="save" type="button" disabled>保存属性</button>
          <button id="remove" class="danger" type="button" disabled>从配置移除</button>
        </div>
      </section>

      <div class="hint">
        <strong>筛选规则：</strong>theme 跟随浅色/深色，platform 以 760px 为界。无匹配时使用 <code>both/both</code> 保底；没有保底图时显示纯白/纯黑。
      </div>

      <footer class="footer">
        <span>配置：<code>config/backgrounds.json</code></span>
        <span>图片：<code>public/images/backgrounds</code></span>
        <span class="status" id="status"></span>
      </footer>
    </main>
  </div>

  <script>
    const listEl = document.querySelector("#list");
    const previewEl = document.querySelector("#preview");
    const themeEl = document.querySelector("#theme");
    const platformEl = document.querySelector("#platform");
    const saveEl = document.querySelector("#save");
    const removeEl = document.querySelector("#remove");
    const statusEl = document.querySelector("#status");
    const syncEl = document.querySelector("#sync");
    const pruneEl = document.querySelector("#prune");
    const reloadEl = document.querySelector("#reload");

    let state = { images: [], entries: [], missing: [] };
    let selectedFile = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function setStatus(message, kind = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${kind}`.trim();
    }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    function selectedEntry() {
      return state.entries.find((entry) => entry.file === selectedFile) || null;
    }

    function renderList() {
      const names = new Set(state.images.map((image) => image.file));
      const rows = [];
      const seen = new Set();

      for (const entry of state.entries) {
        seen.add(entry.file);
        rows.push({ ...entry, size: state.images.find((image) => image.file === entry.file)?.size ?? 0, exists: names.has(entry.file) });
      }
      for (const image of state.images) {
        if (seen.has(image.file)) continue;
        rows.push({ file: image.file, theme: "both", platform: "both", size: image.size, exists: true, unlisted: true });
      }

      listEl.innerHTML = "";
      for (const row of rows) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `item${row.file === selectedFile ? " active" : ""}${row.exists ? "" : " warn"}`;
        button.setAttribute("role", "option");
        button.setAttribute("aria-selected", row.file === selectedFile ? "true" : "false");
        button.innerHTML = `
          <span class="thumb" style="background-image:url('/images/${encodeURIComponent(row.file)}')"></span>
          <span>
            <span class="item-name">${escapeHtml(row.file)}</span>
            <span class="item-meta">${row.exists ? `${escapeHtml(row.theme)} / ${escapeHtml(row.platform)} · ${formatSize(row.size)}` : "文件缺失"}</span>
          </span>`;
        button.addEventListener("click", () => selectFile(row.file));
        listEl.appendChild(button);
      }

      if (rows.length === 0) {
        listEl.innerHTML = '<p class="hint">目录中没有背景图。把图片放进 public/images/backgrounds 后点击“同步目录”。</p>';
      }
    }

    function renderPreview() {
      const entry = selectedEntry();
      previewEl.className = "preview";
      previewEl.innerHTML = "";

      if (!selectedFile) {
        previewEl.classList.add("empty");
        previewEl.innerHTML = "<span>选择一张背景图查看预览</span>";
        return;
      }

      const image = document.createElement("img");
      image.alt = selectedFile;
      image.onload = () => image.classList.add("ready");
      image.onerror = () => {
        previewEl.classList.add("empty");
        previewEl.innerHTML = `<span>无法加载 ${escapeHtml(selectedFile)}，可能文件已缺失。</span>`;
      };
      image.src = `/images/${encodeURIComponent(selectedFile)}?v=${Date.now()}`;
      previewEl.appendChild(image);

      const label = document.createElement("span");
      label.className = "preview-label";
      label.textContent = entry ? `${entry.theme} / ${entry.platform}` : "未写入配置";
      previewEl.appendChild(label);
    }

    function render() {
      renderList();
      renderPreview();
      const entry = selectedEntry();
      themeEl.value = entry?.theme || "both";
      platformEl.value = entry?.platform || "both";
      themeEl.disabled = !selectedFile;
      platformEl.disabled = !selectedFile;
      saveEl.disabled = !selectedFile;
      removeEl.disabled = !selectedFile || !entry;
    }

    function selectFile(file) {
      selectedFile = file;
      render();
      setStatus("");
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `请求失败 (${response.status})`);
      return data;
    }

    function applyState(nextState) {
      state = nextState;
      if (selectedFile && !state.images.some((image) => image.file === selectedFile)) {
        selectedFile = null;
      }
      if (!selectedFile && state.images.length > 0) {
        selectedFile = state.images[0].file;
      }
      render();
    }

    async function loadState(message = "") {
      const data = await request("/api/state");
      applyState(data.state);
      if (message) setStatus(message, "ok");
    }

    syncEl.addEventListener("click", async () => {
      syncEl.disabled = true;
      try {
        const data = await request("/api/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prune: false }),
        });
        applyState(data.state);
        setStatus(`同步完成：新增 ${data.result.added}，移除 ${data.result.removed}`, "ok");
      } catch (error) {
        setStatus(error.message, "error");
      } finally {
        syncEl.disabled = false;
      }
    });

    pruneEl.addEventListener("click", async () => {
      if (!window.confirm("移除配置中所有文件已不存在的条目？图片文件不会被删除。")) return;
      pruneEl.disabled = true;
      try {
        const data = await request("/api/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prune: true }),
        });
        applyState(data.state);
        setStatus(`清理完成：移除 ${data.result.removed} 个缺失条目`, "ok");
      } catch (error) {
        setStatus(error.message, "error");
      } finally {
        pruneEl.disabled = false;
      }
    });

    reloadEl.addEventListener("click", async () => {
      try {
        await loadState("已刷新");
      } catch (error) {
        setStatus(error.message, "error");
      }
    });

    saveEl.addEventListener("click", async () => {
      if (!selectedFile) return;
      saveEl.disabled = true;
      saveEl.textContent = "保存中...";
      try {
        const data = await request("/api/update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file: selectedFile, theme: themeEl.value, platform: platformEl.value }),
        });
        applyState(data.state);
        setStatus(`已保存 ${selectedFile}`, "ok");
        saveEl.textContent = "已保存";
        window.setTimeout(() => { saveEl.textContent = "保存属性"; }, 900);
      } catch (error) {
        setStatus(error.message, "error");
        saveEl.textContent = "保存属性";
      } finally {
        saveEl.disabled = false;
      }
    });

    removeEl.addEventListener("click", async () => {
      if (!selectedFile) return;
      if (!window.confirm(`从配置中移除 ${selectedFile}？图片文件不会被删除。`)) return;
      try {
        const data = await request("/api/remove", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file: selectedFile }),
        });
        applyState(data.state);
        setStatus(`已移除 ${selectedFile}`, "ok");
      } catch (error) {
        setStatus(error.message, "error");
      }
    });

    themeEl.addEventListener("change", () => { saveEl.textContent = "保存属性"; });
    platformEl.addEventListener("change", () => { saveEl.textContent = "保存属性"; });

    loadState().catch((error) => setStatus(error.message, "error"));
  </script>
</body>
</html>
