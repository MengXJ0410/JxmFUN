<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JxmFUN 开发启动器</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(15, 27, 36, 0.9);
      --line: rgba(170, 220, 235, 0.15);
      --text: #e7f5f8;
      --muted: #83a4ad;
      --cyan: #28dce4;
      --green: #76e2a0;
      --red: #ff6b7d;
      --yellow: #f3c969;
      font-family: ui-sans-serif, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(40, 220, 228, 0.15), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(255, 121, 176, 0.1), transparent 32%),
        linear-gradient(145deg, #061018, #091923 55%, #111522);
      color: var(--text);
    }

    button { font: inherit; cursor: pointer; }

    .shell {
      display: grid;
      height: calc(100vh - 1.5rem);
      margin: 0.75rem;
      grid-template-columns: 350px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
    }

    .left {
      display: flex;
      min-height: 0;
      flex-direction: column;
      border-right: 1px solid var(--line);
    }

    .brand {
      padding: 1rem 1.1rem 0.85rem;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 { margin: 0; font-size: 0.98rem; letter-spacing: 0.03em; }
    .brand p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.7rem; line-height: 1.5; overflow-wrap: anywhere; }

    .actions {
      display: grid;
      gap: 0.55rem;
      padding: 0.85rem;
      border-bottom: 1px solid var(--line);
    }

    .action {
      display: grid;
      gap: 0.2rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .action:hover:not(:disabled) { border-color: rgba(40, 220, 228, 0.5); background: rgba(40, 220, 228, 0.08); }
    .action:disabled { cursor: not-allowed; opacity: 0.45; }
    .action strong { font-size: 0.8rem; font-weight: 650; }
    .action small { color: var(--muted); font-size: 0.66rem; line-height: 1.45; }
    .action.primary { border-color: rgba(40, 220, 228, 0.45); }
    .action.sync { border-color: rgba(118, 226, 160, 0.5); background: rgba(118, 226, 160, 0.06); }
    .action.deploy { border-color: rgba(255, 121, 176, 0.35); }

    .status {
      display: grid;
      gap: 0.55rem;
      padding: 0.85rem;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.7rem 0.75rem;
      background: rgba(255, 255, 255, 0.025);
    }

    .card h2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 0.45rem;
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .row { display: flex; justify-content: space-between; gap: 0.6rem; font-size: 0.72rem; line-height: 1.55; }
    .row span:first-child { color: var(--muted); flex: 0 0 auto; }
    .row span:last-child { overflow: hidden; text-align: right; text-overflow: ellipsis; white-space: nowrap; }

    .dot { display: inline-block; width: 0.46rem; height: 0.46rem; margin-right: 0.35rem; border-radius: 50%; background: var(--muted); vertical-align: 0.02rem; }
    .dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(118, 226, 160, 0.6); }
    .dot.warn { background: var(--yellow); }
    .dot.bad { background: var(--red); }

    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.68rem; }

    .right {
      display: flex;
      min-width: 0;
      flex-direction: column;
    }

    .console-head {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      border-bottom: 1px solid var(--line);
      padding: 0.7rem 0.9rem;
    }

    .console-head strong { font-size: 0.78rem; }
    .console-head span { color: var(--muted); font-size: 0.68rem; }
    .console-head .spacer { flex: 1; }

    .console-head button {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0.32rem 0.6rem;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 0.68rem;
    }

    .console-head button:hover { border-color: rgba(40, 220, 228, 0.5); color: var(--cyan); }

    .console {
      flex: 1;
      overflow: auto;
      padding: 0.8rem 0.95rem;
      background: #040b10;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.72rem;
      line-height: 1.55;
      scrollbar-width: thin;
    }

    .line { white-space: pre-wrap; overflow-wrap: anywhere; }
    .line.err { color: var(--red); }
    .line.ok { color: var(--green); }
    .line.info { color: var(--cyan); }
    .line.warn { color: var(--yellow); }

    .empty { color: var(--muted); }

    @media (max-width: 820px) {
      .shell {
        height: auto;
        min-height: calc(100vh - 1rem);
        margin: 0.5rem;
        grid-template-columns: 1fr;
      }
      .left { border-right: 0; border-bottom: 1px solid var(--line); }
      .console { min-height: 50vh; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="left">
      <header class="brand">
        <h1>JxmFUN 开发启动器</h1>
        <p id="cwd">读取项目路径中...</p>
      </header>

      <div class="actions">
        <button class="action sync" data-action="sync-all" type="button">
          <strong>一键同步服务端</strong>
          <small>自动提交本地改动 → 推送 → 服务器拉取重建 → 打开网页</small>
        </button>
        <button class="action primary" data-action="dev" type="button">
          <strong>启动本地测试</strong>
          <small>重启 3100 端口开发服务器，并打开网页</small>
        </button>
        <button class="action" data-action="stop-dev" type="button">
          <strong>停止本地开发服务器</strong>
          <small>释放 3100 端口</small>
        </button>
        <button class="action" data-action="push" type="button">
          <strong>执行 git 推送</strong>
          <small>只推送已提交内容；一键同步会自动提交</small>
        </button>
        <button class="action deploy" data-action="deploy" type="button">
          <strong>服务端拉取并重启</strong>
          <small>SSH 到 mxj，拉取 server/main 后重建并重启容器</small>
        </button>
      </div>

      <div class="status">
        <section class="card">
          <h2>本地开发 <span id="devBadge" class="mono">检查中</span></h2>
          <div class="row"><span>地址</span><span class="mono" id="devUrl">-</span></div>
          <div class="row"><span>端口</span><span class="mono" id="devPort">-</span></div>
          <div class="row"><span>响应</span><span class="mono" id="devHealth">-</span></div>
        </section>

        <section class="card">
          <h2>本地 Git</h2>
          <div class="row"><span>分支</span><span class="mono" id="gitBranch">-</span></div>
          <div class="row"><span>未提交</span><span class="mono" id="gitDirty">-</span></div>
          <div class="row"><span>领先 / 落后</span><span class="mono" id="gitAhead">-</span></div>
          <div class="row"><span>最新提交</span><span class="mono" id="gitHead">-</span></div>
        </section>

        <section class="card">
          <h2>服务器 <span id="serverBadge" class="mono">检查中</span></h2>
          <div class="row"><span>提交</span><span class="mono" id="serverCommit">-</span></div>
          <div class="row"><span>工作区</span><span class="mono" id="serverDirty">-</span></div>
          <div class="row"><span>容器</span><span class="mono" id="serverContainer">-</span></div>
        </section>
      </div>
    </aside>

    <main class="right">
      <div class="console-head">
        <strong>控制台</strong>
        <span id="jobLabel">空闲</span>
        <span class="spacer"></span>
        <button id="clear" type="button">清空</button>
      </div>
      <div class="console" id="console"><p class="empty">等待操作...</p></div>
    </main>
  </div>

  <script>
    const consoleEl = document.querySelector("#console");
    const jobLabel = document.querySelector("#jobLabel");
    const cwdEl = document.querySelector("#cwd");
    const buttons = [...document.querySelectorAll("[data-action]")];
    const statusEls = {
      devBadge: document.querySelector("#devBadge"),
      devUrl: document.querySelector("#devUrl"),
      devPort: document.querySelector("#devPort"),
      devHealth: document.querySelector("#devHealth"),
      gitBranch: document.querySelector("#gitBranch"),
      gitDirty: document.querySelector("#gitDirty"),
      gitAhead: document.querySelector("#gitAhead"),
      gitHead: document.querySelector("#gitHead"),
      serverBadge: document.querySelector("#serverBadge"),
      serverCommit: document.querySelector("#serverCommit"),
      serverDirty: document.querySelector("#serverDirty"),
      serverContainer: document.querySelector("#serverContainer"),
    };

    let currentJob = null;
    let pollTimer = 0;
    let statusTimer = 0;
    let cursor = 0;

    function clearConsole() {
      consoleEl.innerHTML = "";
      cursor = 0;
    }

    function classify(line) {
      if (/error|failed|fatal|denied|错误|失败/i.test(line)) return "err";
      if (/warn|warning|警告/i.test(line)) return "warn";
      if (/ready|compiled|success|ok|healthy|完成|成功/i.test(line)) return "ok";
      if (/^\s*>\s|running|starting|pulling|building|created|restart/i.test(line)) return "info";
      return "";
    }

    function append(lines) {
      if (lines.length === 0) return;
      const empty = consoleEl.querySelector(".empty");
      if (empty) empty.remove();
      const fragment = document.createDocumentFragment();
      for (const line of lines) {
        const node = document.createElement("div");
        node.className = `line ${classify(line)}`.trim();
        node.textContent = line;
        fragment.appendChild(node);
      }
      consoleEl.appendChild(fragment);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function setBusy(busy) {
      for (const button of buttons) button.disabled = busy;
    }

    async function loadStatus() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "状态读取失败");
        renderStatus(data);
      } catch {
        statusEls.serverBadge.textContent = "读取失败";
        statusEls.serverBadge.className = "mono";
      }
    }

    function renderStatus(data) {
      cwdEl.textContent = data.cwd;
      const health = data.health;
      statusEls.devUrl.textContent = data.dev.url;
      statusEls.devPort.textContent = String(data.dev.port);
      statusEls.devHealth.textContent = health.up ? `HTTP ${health.status} · ${health.ms}ms` : "未启动";
      statusEls.devBadge.innerHTML = `<i class="dot ${health.up ? "ok" : "warn"}"></i>${data.dev.running ? "运行中" : "未运行"}`;

      const git = data.git;
      statusEls.gitBranch.textContent = git.branch;
      statusEls.gitDirty.textContent = git.dirty ? `${git.changes.length} 项未提交` : "干净";
      statusEls.gitAhead.textContent = `${git.ahead} / ${git.behind}`;
      statusEls.gitHead.textContent = git.log[0] || "-";

      const server = data.server;
      statusEls.serverBadge.innerHTML = `<i class="dot ${server.reachable ? "ok" : "bad"}"></i>${server.reachable ? "在线" : "离线"}`;
      statusEls.serverCommit.textContent = server.reachable ? server.commit : (server.error || "-");
      statusEls.serverDirty.textContent = server.reachable ? (server.dirty ? `${server.changes.length} 项` : "干净") : "-";
      statusEls.serverContainer.textContent = server.container || "-";
    }

    async function pollJob() {
      if (!currentJob) return;
      try {
        const response = await fetch(`/api/job?id=${encodeURIComponent(currentJob)}&from=${cursor}`, { cache: "no-store" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "任务读取失败");
        if (data.lines.length > 0) append(data.lines);
        cursor = data.total;
        if (data.done) {
          jobLabel.textContent = data.code === 0 ? "完成" : `失败（退出码 ${data.code}）`;
          currentJob = null;
          window.clearInterval(pollTimer);
          setBusy(false);
          void loadStatus();
          return;
        }
        jobLabel.textContent = "运行中...";
      } catch (error) {
        append([`[launcher] ${error.message}`]);
      }
    }

    async function runAction(action) {
      setBusy(true);
      clearConsole();
      cursor = 0;
      jobLabel.textContent = "启动中...";
      try {
        const response = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "操作失败");
        if (data.stopped !== undefined) {
          append([data.stopped ? "[launcher] 已停止开发服务器" : "[launcher] 没有正在运行的开发服务器"]);
          jobLabel.textContent = "完成";
          setBusy(false);
          void loadStatus();
          return;
        }
        if (!data.jobId) {
          jobLabel.textContent = "完成";
          setBusy(false);
          void loadStatus();
          return;
        }
        currentJob = data.jobId;
        window.clearInterval(pollTimer);
        pollTimer = window.setInterval(pollJob, 450);
        void pollJob();
        if (action === "dev") setBusy(false);
      } catch (error) {
        append([`[launcher] ${error.message}`]);
        jobLabel.textContent = "失败";
        setBusy(false);
      }
    }

    for (const button of buttons) {
      button.addEventListener("click", () => runAction(button.dataset.action));
    }

    document.querySelector("#clear").addEventListener("click", () => {
      clearConsole();
      consoleEl.innerHTML = '<p class="empty">已清空</p>';
    });

    void loadStatus();
    statusTimer = window.setInterval(loadStatus, 5000);

    window.addEventListener("beforeunload", () => {
      window.clearInterval(statusTimer);
      window.clearInterval(pollTimer);
    });
  </script>
</body>
</html>
